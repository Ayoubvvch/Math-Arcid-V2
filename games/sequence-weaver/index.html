<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, viewport-fit=cover" />
  <title>نسّاج المتتاليات — معركة التقارب | Math-Arcid-V2</title>
  <meta name="description" content="لعبة أركيد تفاعلية حقيقية للدرس 3 (المتتاليات العددية 2BAC PC): حارس الترجع والمكبر، قنّاص الرتابة MCT، إيقاع المتتاليات الهندسية، صائد النقط الصامدة، ونفق الدركيين بدعم كامل لـ DualSense." />
  <link rel="stylesheet" href="../../css/common.css" />
  <link rel="stylesheet" href="../../shared/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
</head>
<body class="sw-arcade-body">
  <div class="sw-shell">
    <header class="sw-topbar">
      <div class="sw-top-group">
        <button id="btnPause" class="sw-pill sw-pause-btn" type="button" title="القائمة والإيقاف [Start / Esc]">
          <span>⏸</span>
          <span>القائمة (Start)</span>
        </button>
        <div class="sw-brand">
          <span class="sw-emblem" data-tex="u_n" dir="ltr"></span>
          <div>
            <h1 class="sw-title">نسّاج المتتاليات</h1>
            <div class="sw-sub">معركة التقارب • <bdi dir="ltr" class="math-ltr">2BAC PC (41–52)</bdi></div>
          </div>
        </div>
      </div>

      <nav id="stageNav" class="sw-stage-nav" aria-label="أطوار المتتاليات"></nav>

      <div class="sw-top-group sw-hud-stats">
        <div id="gpBadge" class="gp-pill-badge">🎮 لوحة المفاتيح / الماوس</div>
        <div class="sw-stat"><span>النقاط</span><strong id="hudScore" dir="ltr">0</strong></div>
        <div class="sw-stat"><span>الكومبو</span><strong id="hudCombo" dir="ltr">×1</strong></div>
        <div class="sw-stat"><span>الدرع</span><strong id="hudHp" dir="ltr">♥♥♥♥♥</strong></div>
        <button id="btnAudio" class="sw-pill" type="button" title="الصوت [M]">🔊</button>
      </div>
    </header>

    <main class="sw-arena-wrap">
      <div class="sw-mission-strip">
        <div class="sw-mission-left">
          <span id="stageBadge" class="sw-badge">الطور 1/5</span>
          <span id="stageTitle" class="sw-stage-title">حارس الترجع والمكبر</span>
          <span id="stageFormula" class="sw-formula" data-tex="u_{n+1} = \frac{1}{2}u_n + 2" dir="ltr"></span>
        </div>
        <div class="sw-mission-right">
          <span id="stageGoal" class="sw-goal"></span>
          <div class="sw-progress-track"><div id="stageProgressFill" class="sw-progress-fill"></div></div>
        </div>
      </div>

      <div id="canvasBox" class="sw-canvas-box">
        <canvas id="weaverCanvas" role="application" aria-label="ساحة معركة المتتاليات التفاعلية"></canvas>
        <div id="toastFeed" class="sw-toast hidden" aria-live="polite"></div>
      </div>

      <footer class="sw-action-deck" aria-label="أزرار اللعب السريعة">
        <div id="deckButtons" class="sw-deck-btns"></div>
        <div id="deckHint" class="sw-deck-hint"></div>
      </footer>
    </main>
  </div>

  <!-- شاشة النصر / انتهاء المحاولة -->
  <div id="endOverlay" class="sw-end-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="sw-end-card">
      <div id="endGlyph" class="sw-end-glyph">🏆</div>
      <h2 id="endTitle" class="sw-end-title">انتهت المهمة!</h2>
      <p id="endDesc" class="sw-end-desc"></p>
      <div class="sw-end-grid">
        <div class="sw-end-stat"><span>النتيجة</span><strong id="endScore" dir="ltr">0</strong></div>
        <div class="sw-end-stat"><span>الدقة</span><strong id="endAcc" dir="ltr">100%</strong></div>
        <div class="sw-end-stat"><span>الرتبة</span><strong id="endRank" dir="ltr">S</strong></div>
      </div>
      <div class="sw-end-actions">
        <button id="btnEndPrimary" class="sw-end-btn primary" type="button">🔄 العب مجدداً (✕)</button>
        <button id="btnEndNext" class="sw-end-btn hidden" type="button">➡ الطور التالي (△)</button>
        <a id="btnEndHub" href="../../index.html?from=game" class="sw-end-btn danger">🏠 بوابة الألعاب (◯)</a>
      </div>
    </div>
  </div>

  <script src="../../shared/vendor/katex/katex.min.js"></script>
  <script src="../../shared/arcade-core.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
