<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Math Battle: Calculus Showdown [PlayStation Edition] - Math Arcade</title>
  <meta name="description" content="PlayStation-exclusive mathematical calculus combat arcade. Differentiate polynomials, trigonometric waves, and exponential bosses to zero annihilation.">
  <link rel="stylesheet" href="../../css/common.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header & Hub Link -->
    <header class="top-nav">
      <a href="../../" class="hub-back-btn">‹ ARCADE HUB</a>
      <span style="font-weight: 900; letter-spacing: 0.5px; color: #f8fafc;">MATH BATTLE: d/dx SHOWDOWN</span>
      <button id="btnAudio" class="btn" style="padding: 2px 7px; font-size: 9px;">🔊 AUDIO: ON</button>
    </header>

    <!-- Match Roster Selector Bar -->
    <div class="roster-tabs">
      <button class="roster-btn active" data-match="x3">x³ (CUBIC BOSS)</button>
      <button class="roster-btn" data-match="x4">x⁴ (QUARTIC)</button>
      <button class="roster-btn" data-match="sin">sin(x) (TRIG)</button>
      <button class="roster-btn" data-match="exp">eˣ (IMMORTAL)</button>
    </div>

    <!-- Pilot & Controller Status Bar -->
    <div class="pilot-bar">
      <div class="pilot-toggle-group">
        <button id="pilotPlayer" class="pilot-toggle-btn active">PILOT (YOU)</button>
        <button id="pilotAuto" class="pilot-toggle-btn">AUTO PILOT</button>
      </div>

      <div class="controller-badge">
        <span id="padDot" class="pad-dot"></span>
        <span id="padStatus">PS CONTROLLER: CONNECT VIA USB / BT</span>
      </div>
    </div>

    <!-- Canvas Viewport -->
    <main class="viewport" id="viewport">
      <canvas id="gameCanvas" width="540" height="960"></canvas>

      <!-- Mobile Touch Joystick Area & PlayStation Button Cluster -->
      <div class="touch-stick-area" id="touchStickArea"></div>
      <div class="touch-controls">
        <div></div>
        <div class="touch-cluster">
          <button id="touchDashBtn" class="touch-btn touch-btn-cross" title="Triple Dash (✕)">
            <span style="font-size: 15px; font-weight: 900;">✕</span>
            <span>DASH</span>
          </button>
          <button id="touchBeamBtn" class="touch-btn touch-btn-square" title="Calculus Beam (▢)">
            <span style="font-size: 14px; font-weight: 900;">▢</span>
            <span>BEAM</span>
          </button>
          <button id="touchBombBtn" class="touch-btn touch-btn-circle" title="Leibniz Bomb (◯)">
            <span style="font-size: 15px; font-weight: 900;">◯</span>
            <span>BOMB</span>
          </button>
        </div>
      </div>
    </main>

    <!-- PlayStation Controller Guide Bar -->
    <div class="guide-box">
      <strong>PLAYSTATION DUALSENSE:</strong>
      [✕] Dash &nbsp;|&nbsp;
      [▢] Beam &nbsp;|&nbsp;
      [◯] Leibniz Bomb &nbsp;|&nbsp;
      [△] Slow-Mo &nbsp;|&nbsp;
      [L1/R1] Match &nbsp;|&nbsp;
      [L2/R2] Brake/Fire
    </div>

    <!-- Control Deck -->
    <footer class="deck">
      <div class="action-row">
        <button id="btnStart" class="btn btn-primary">⏸ PAUSE BATTLE</button>
        <button id="btnRestart" class="btn">🔄 RESTART MATCH</button>
        <button class="btn btn-speed" data-speed="0.5">0.5x</button>
        <button class="btn btn-speed active" data-speed="1.0">1.0x</button>
        <button class="btn btn-speed" data-speed="1.5">1.5x</button>
        <button class="btn btn-speed" data-speed="2.0">2.0x</button>
      </div>
    </footer>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
