<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, viewport-fit=cover" />
  <title>متزلّج الاتصال — سباق النهايات و TVI | Math-Arcid-V2</title>
  <meta name="description" content="لعبة تزلّج فيزيائية سريعة للدرس 1 (النهايات والاتصال 2BAC PC): تزلّج على المنحنى بالزمن الحقيقي، أطلق أشعة التعميل والمرافق والمثلثية لردم ثقوب 0/0، اقفز فوق مدرّج E(x)، اشطر حواجز TVI، واقلب البُعد عبر y=x بدعم كامل لـ DualSense." />
  <link rel="stylesheet" href="../../css/common.css" />
  <link rel="stylesheet" href="../../shared/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
</head>
<body class="cr-arcade-body">
  <div class="cr-shell">
    <header class="cr-topbar">
      <div class="cr-top-group">
        <button id="btnPause" class="cr-pill cr-pause-btn" type="button" title="القائمة والإيقاف [Start / Esc]">
          <span>⏸</span>
          <span>القائمة (Start)</span>
        </button>
        <div class="cr-brand">
          <span class="cr-emblem" data-tex="\lim" dir="ltr"></span>
          <div>
            <h1 class="cr-title">متزلّج الاتصال</h1>
            <div class="cr-sub">سباق النهايات و TVI • <bdi dir="ltr" class="math-ltr">2BAC PC (1–22)</bdi></div>
          </div>
        </div>
      </div>

      <nav id="sectorNav" class="cr-sector-nav" aria-label="مضامير الدرس الأول"></nav>

      <div class="cr-top-group cr-hud-stats">
        <div id="gpBadge" class="gp-pill-badge">🎮 لوحة المفاتيح / الماوس</div>
        <div class="cr-stat"><span>النقاط</span><strong id="hudScore" dir="ltr">0</strong></div>
        <div class="cr-stat"><span>الكومبو</span><strong id="hudCombo" dir="ltr">×1</strong></div>
        <div class="cr-stat"><span>الطاقة</span><strong id="hudHp" dir="ltr">♥♥♥♥♥</strong></div>
        <button id="btnAudio" class="cr-pill" type="button" title="الصوت [M]">🔊</button>
      </div>
    </header>

    <main class="cr-stage">
      <div class="cr-hud-strip">
        <div class="cr-hud-left">
          <span id="sectorBadge" class="cr-badge">المضمار 1/5</span>
          <span id="sectorTitle" class="cr-sector-title"></span>
          <span id="sectorFormula" class="cr-formula" dir="ltr"></span>
        </div>
        <div class="cr-hud-right">
          <span id="sectorGoal" class="cr-goal"></span>
          <div class="cr-progress-track"><div id="progressFill" class="cr-progress-fill"></div></div>
        </div>
      </div>

      <div id="canvasFrame" class="cr-canvas-frame">
        <canvas id="riderCanvas" role="application" aria-label="مسار التزلّج الرياضي التفاعلي"></canvas>
        <div id="toastBanner" class="cr-toast hidden" aria-live="polite"></div>
      </div>

      <footer class="cr-action-deck" aria-label="أسلحة وأزرار التزلّج">
        <div id="deckButtons" class="cr-deck-btns"></div>
        <div id="deckHint" class="cr-deck-hint"></div>
      </footer>
    </main>
  </div>

  <!-- نافذة النتيجة -->
  <div id="finishOverlay" class="cr-end-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="endTitle">
    <div class="cr-end-card">
      <div id="endGlyph" class="cr-end-glyph">🏆</div>
      <h2 id="endTitle" class="cr-end-title">انتهى السباق!</h2>
      <p id="endDesc" class="cr-end-desc"></p>
      <div class="cr-end-grid">
        <div class="cr-end-stat"><span>النقاط</span><strong id="endScore" dir="ltr">0</strong></div>
        <div class="cr-end-stat"><span>الدقة</span><strong id="endAcc" dir="ltr">100%</strong></div>
        <div class="cr-end-stat"><span>الرتبة</span><strong id="endRank" dir="ltr">S</strong></div>
      </div>
      <div class="cr-end-actions">
        <button id="btnEndReplay" class="cr-end-btn primary" type="button">🔄 أعد السباق (✕)</button>
        <button id="btnEndNext" class="cr-end-btn hidden" type="button">➡ المضمار التالي (△)</button>
        <a id="btnEndHub" href="../../index.html?from=game" class="cr-end-btn danger">🏠 بوابة الألعاب (◯)</a>
      </div>
    </div>
  </div>

  <script src="../../shared/vendor/katex/katex.min.js"></script>
  <script src="../../shared/arcade-core.js"></script>
  <script type="module" src="js/game.js"></script>
</body>
</html>
